<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pressmark | Professional QR Code Generator</title>
    <meta name="description" content="Create custom, high-quality QR codes for free. Support for text, URL, WiFi, vCard, bulk batch processing, and extensive design customization." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pressmark.app/" />
    <meta property="og:title" content="Pressmark | Professional QR Code Generator" />
    <meta property="og:description" content="Create custom, high-quality QR codes for free. Support for text, URL, WiFi, vCard, bulk batch processing, and extensive design customization." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pressmark.app/" />
    <meta property="twitter:title" content="Pressmark | Professional QR Code Generator" />
    <meta property="twitter:description" content="Create custom, high-quality QR codes for free. Support for text, URL, WiFi, vCard, bulk batch processing, and extensive design customization." />
  </head>
  <body class="transition-colors duration-300 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Early script to prevent flash of wrong theme
      (function() {
        try {
          var localValue = localStorage.getItem('theme-storage');
          var isDark = false;
          if (localValue) {
            var state = JSON.parse(localValue).state;
            if (state.theme === 'dark') isDark = true;
            else if (state.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
